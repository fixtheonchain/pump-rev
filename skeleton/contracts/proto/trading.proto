syntax = "proto3";
package trading.v1;

// Enums and ordinals: reconstruction/data-pipeline.md. Payload numbers/layouts are local contracts.
enum Commitment { COMMITMENT_UNSPECIFIED = 0; PROCESSED = 1; CONFIRMED = 2; }
enum Part { PART_UNSPECIFIED = 0; MARKET = 1; PHASE = 2; META = 3; POSITION = 4; HOLDERS = 5; MARKS = 6; CANDLES = 7; }
enum FrameKind { FRAME_KIND_UNSPECIFIED = 0; SNAPSHOT = 1; LIVE = 2; CORRECTION = 3; }
message Ordinal { uint64 block_id = 1; uint32 tx_index = 2; uint32 event_index = 3; int64 block_time_ms = 4; }
message CandleSpec { string res = 1; string measure = 2; }
message CoinTopic { string chain = 1; string address = 2; repeated Part parts = 3; Commitment commitment = 4; repeated CandleSpec candles = 5; }
message WalletTopic { string wallet = 1; string chain = 2; }
message ListTopic { string list = 1; }
message Subscription { oneof topic { CoinTopic coin = 1; WalletTopic wallet = 2; ListTopic list = 3; } }
message WatchRequest { repeated Subscription subscribe = 1; repeated string unsubscribe = 2; bool hidden = 3; }
message Trade {
  Ordinal ordinal = 1; string signature = 2; string wallet = 3; string side = 4;
  string base_amount = 5; string quote_amount = 6; string quote_mint = 7;
  string price_usd = 8; string market_cap_usd = 9; string fee_protocol = 10;
  string fee_creator = 11; Commitment commitment = 12; string slot_index_id = 13;
}
message CoinState {
  string chain = 1; string address = 2; string name = 3; string symbol = 4;
  string price_usd = 5; string market_cap_usd = 6; uint64 holder_count = 7;
  bool complete = 8; bool mayhem = 9; uint32 base_decimals = 10;
  uint32 quote_decimals = 11; string quote_mint = 12; Ordinal ordinal = 13;
  Commitment commitment = 14; string description = 15;
}
message Position { string wallet = 1; string chain = 2; string address = 3; string amount_atomic = 4; string value_usd = 5; string price_usd = 6; }
message Candle { int64 time_ms = 1; string open = 2; string high = 3; string low = 4; string close = 5; string volume_base = 6; string volume_quote = 7; uint64 trade_count = 8; }
message CandleSeries { string res = 1; string measure = 2; repeated Candle candles = 3; }
message CoinFrame { CoinState state = 1; repeated Trade trades = 2; repeated CandleSeries candles = 3; Position position = 4; bool removed = 5; repeated Part parts = 6; }
message WalletFrame { string wallet = 1; repeated Position positions = 2; }
message ListFrame { string list = 1; repeated CoinState coins = 2; }
message Frame {
  string topic = 1; uint64 seq = 2; FrameKind kind = 3; Ordinal ordinal = 4;
  bool gap = 5; bool heartbeat = 6;
  oneof payload { CoinFrame coin = 10; WalletFrame wallet = 11; ListFrame list = 12; }
}
message CoinRequest { string chain = 1; string address = 2; Commitment commitment = 3; }
message CoinResponse { CoinState coin = 1; }
message TradesRequest { string chain = 1; string address = 2; uint32 limit = 3; string cursor = 4; Commitment commitment = 5; }
message TradesResponse { repeated Trade trades = 1; string next_cursor = 2; }
message CandlesRequest { string chain = 1; string address = 2; string res = 3; string measure = 4; int64 from_ms = 5; int64 to_ms = 6; uint32 limit = 7; Commitment commitment = 8; }
message CandlesResponse { repeated Candle candles = 1; string res = 2; string measure = 3; }
message HoldersResponse { uint64 holder_count = 1; }
message PositionRequest { string chain = 1; string address = 2; string wallet = 3; Commitment commitment = 4; }
message HealthRequest {}
message HealthResponse { string status = 1; }
service TradeApi {
  rpc GetCoin(CoinRequest) returns (CoinResponse);
  rpc GetTrades(TradesRequest) returns (TradesResponse);
  rpc GetCandles(CandlesRequest) returns (CandlesResponse);
  rpc GetHolders(CoinRequest) returns (HoldersResponse);
  rpc GetPosition(PositionRequest) returns (Position);
  rpc Watch(WatchRequest) returns (stream Frame);
  rpc Health(HealthRequest) returns (HealthResponse);
}
